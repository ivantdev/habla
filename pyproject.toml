[project]
name = "habla"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.124,<1",
    "pydantic>=2.12,<3",
    "python-multipart>=0.0.22,<1",
    "uvicorn>=0.38,<1",
    "websockets>=15,<17",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
